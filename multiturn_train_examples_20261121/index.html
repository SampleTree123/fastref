<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三轮编辑 · 训练集示例</title><style>body{font:16px/1.5 system-ui,sans-serif;max-width:1500px;margin:28px auto;padding:0 16px;color:#24333e}section{border-top:1px solid #bbc4cb;margin:2rem 0}section>div{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}figure{margin:0}video{width:100%;max-height:440px;background:#15191c}details{margin-top:6px}figcaption{margin-bottom:8px}@media(max-width:800px){section>div{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>训练集中的三轮视频编辑</h1><p>每段均为 UE 真值视频。箭头标出该轮编辑从哪个版本开始。</p><section><h2>直链 5554 · 横屏</h2><p>第三轮继续编辑 v2。</p><div><figure><figcaption><b>v0</b> · 节点 2324<br>原始视频</figcaption><video playsinline controls preload="none" poster="media/node_2324_preview.jpg" src="media/node_2324.mp4"></video></figure><figure><figcaption><b>v1</b> · 节点 2333<br>v0 → v1 · 更换整套服装</figcaption><video playsinline controls preload="none" poster="media/node_2333_preview.jpg" src="media/node_2333.mp4"></video><details><summary>数据集原始指令与参考</summary><p>为人物换上参考图中以正面和背面展示、由下装、上衣、鞋子、外套组成的完整穿搭。这是对当前穿搭的整体替换，而不是在原穿搭上添加单件。视频中的其他内容保持不变。第一张参考图展示整套穿搭的正面，第二张展示背面。</p><a href="media/garment_803.png">参考素材 1</a> <a href="media/garment_804.png">参考素材 2</a> </details></figure><figure><figcaption><b>v2</b> · 节点 2343<br>v1 → v2 · 正面拉远 → 背面拉远</figcaption><video playsinline controls preload="none" poster="media/node_2343_preview.jpg" src="media/node_2343.mp4"></video><details><summary>数据集原始指令与参考</summary><p>请将视频的镜头设置改为从人物背面逐渐远离，由上半身过渡到全身的镜头。仅改变镜头设置。保留人物的外观、表情和动作，以及现有场景。请参考提供的图片确定编辑后视频开始时的观察方向、人物位置和取景范围。镜头设置及之后的运动按前述要求执行，并保留输入视频中人物动作的时间顺序和过程。</p><a href="media/camera_ab050dc70b0178c5896ed636508f2f05059dc3bf30fed0aa3738abd19815417b.png">参考素材 1</a> </details></figure><figure><figcaption><b>v3</b> · 节点 2350<br>v2 → v3 · 向前行走 → 举拳庆祝</figcaption><video playsinline controls preload="none" poster="media/node_2350_preview.jpg" src="media/node_2350.mp4"></video><details><summary>数据集原始指令与参考</summary><p>请将人物的动作改为参考视频中展示的动作。参考视频仅用于确定动作。保持人物的身份、外观、表情、场景和镜头不变。</p><a href="media/motion_499.mp4">参考素材 1</a> </details></figure></div></section><section><h2>分叉链 6398 · 横屏</h2><p>第二、三轮都编辑 v1。v2 位于末日城市，v3 回到 v1 的傍晚公路，保留武士顶髻，将黑发改为红发。</p><div><figure><figcaption><b>v0</b> · 节点 1162<br>原始视频</figcaption><video playsinline controls preload="none" poster="media/node_1162_preview.jpg" src="media/node_1162.mp4"></video></figure><figure><figcaption><b>v1</b> · 节点 1167<br>v0 → v1 · 侧梳鲻鱼头 → 武士顶髻</figcaption><video playsinline controls preload="none" poster="media/node_1167_preview.jpg" src="media/node_1167.mp4"></video><details><summary>数据集原始指令与参考</summary><p>我想将人物的发型更换为参考图中展示的发型。只采用参考图中的发型，不采用参考人物的面部特征、发色或服装。当前视频中的其他内容保持不变。</p><a href="media/hair_90.png">参考素材 1</a> <a href="media/hair_6.png">参考素材 2</a> </details></figure><figure><figcaption><b>v2</b> · 节点 1164<br>v1 → v2 · 傍晚公路 → 末日城市</figcaption><video playsinline controls preload="none" poster="media/node_1164_preview.jpg" src="media/node_1164.mp4"></video><details><summary>数据集原始指令与参考</summary><p>我希望将视频的场景更换为参考图展示的环境。用参考图确定目标环境。保持人物、发型、发色、穿搭、表情和动作不变。维持原有的镜头构图与运动，使人物在新场景中自然受光。</p><a href="media/scene_615.png">参考素材 1</a> </details></figure><figure><figcaption><b>v3</b> · 节点 1163<br>v1 → v3 · 回到 v1，黑发 → 红发</figcaption><video playsinline controls preload="none" poster="media/node_1163_preview.jpg" src="media/node_1163.mp4"></video><details><summary>数据集原始指令与参考</summary><p>请以第1轮编辑的结果为基础，在该视频上进行以下编辑：人物目前是黑色头发，将其改为红色。</p></details></figure></div></section></html>
