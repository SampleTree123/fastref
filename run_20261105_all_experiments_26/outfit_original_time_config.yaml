# New independent 2026-11-03 recipe; no resume, no memory probe or inference in the job.
schema: datamake_native_lora_train_v1
# Approved mixed recipe: UE3/CoinVE6, 8 GPUs x batch4 x accumulation4. Steps are derived from the finite sampling plan.
seed: 42
lora:
  rank: 64
  alpha: 64
  dropout: 0.0
  target_modules:
    - attn1.to_q
    - attn1.to_k
    - attn1.to_v
    - attn1.to_out.0
    - attn2.to_q
    - attn2.to_k
    - attn2.to_v
    - attn2.to_out.0
    - ff.net.0.proj
    - ff.net.2
optimization:
  steps: null
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  optimizer_type: adamw
  # Official IC-LoRA linear factors: 1.0 -> 0.1 over the complete mixed plan,
  # independent of checkpoint/validation segment stopping points.
  scheduler_type: linear
  max_grad_norm: 1.0
  enable_gradient_checkpointing: true
checkpoints:
  interval: 50
  keep_last_n: 4
  validation_steps: [50, 256, 512, 768]
  precision: float32
  save_training_state: full
acceleration:
  mixed_precision_mode: bf16
  quantization: null
# Each image keeps its own original dimensions (minimal edge extension to 32 multiples).
reference_protocol: reference_positions_v8_shared_time_refs_source_target
# Real complete-cache paths. The entry exits as not ready until encoding finalizes.
data:
  backend: validated_mixed_cache
  sources_config: configs/training/outfit_images_original_time_768/sources.json
  media_profile: null
  manifest: null
  encoding_roots: []
  sample_ids: []
  order: finite_grouped_mixture_v1
  num_workers: 0
wandb:
  enabled: true
  project: datamake-ltx25
  entity: null
  tags: [native, lora64, video-only, outfit_images_original_time, repeat3_6, steps768]
