<script>
'use strict';
const DATA=JSON.parse(document.getElementById('gallery-data').textContent);
const KEY='qwen_ltx_A_fork_paper_selection_v1';
let picked={};try{picked=JSON.parse(localStorage.getItem(KEY)||'{}');if(!picked||typeof picked!=='object'||Array.isArray(picked))picked={};}catch(e){document.getElementById('storageWarning').style.display='block';}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(picked));}catch(e){document.getElementById('storageWarning').style.display='block';}updateStats();}
function state(id){if(!picked[id]||typeof picked[id]!=='object')picked[id]={chain:false,turns:[],note:''};if(!Array.isArray(picked[id].turns))picked[id].turns=[];return picked[id];}
function video(path,title,downloadName){return `<video controls muted playsinline preload="none" poster="${esc(DATA.posters[path]||'')}" src="${esc(path)}" aria-label="${esc(title)}"></video><div class="links"><a href="${esc(path)}" target="_blank" rel="noopener">单独打开</a><a href="${esc(path)}" download="${esc(downloadName)}">保存视频</a></div>`;}
function route(c){const gap=125,w=70+c.planned_turns*gap,base=102;let paths='',nodes='';for(const t of c.turns){const x=30+t.parent*gap,y=30+t.id*gap,arc=Math.max(20,base-25-(t.id-t.parent)*15),branch=t.parent!==t.id-1;paths+=`<path d="M${x},${base-10} Q${(x+y)/2},${arc} ${y},${base-10}" fill="none" stroke="${branch?'#b15a0a':'#418aa6'}" stroke-width="2" marker-end="url(#arrow-${c.id})"/>`;if(t.parent!==t.expected_parent){const z=30+t.expected_parent*gap;paths+=`<path d="M${z},${base-8} Q${(z+y)/2},8 ${y},${base-8}" fill="none" stroke="#b02e34" stroke-dasharray="4 4"/>`;}}
for(let i=0;i<=c.planned_turns;i++){const available=i<=c.completed_turns;nodes+=`<circle cx="${30+i*gap}" cy="${base}" r="13" fill="${available?'#17698a':'#cbd6dd'}"/><text x="${30+i*gap}" y="${base+5}" text-anchor="middle" fill="white" font-size="13">${i}</text>`;}
return `<svg viewBox="0 0 ${w} 130" width="${w}" role="img" aria-label="${esc(c.turns.map(t=>t.parent+'到'+t.id).join('，'))}"><defs><marker id="arrow-${c.id}" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5" fill="#5e7c8c"/></marker></defs>${paths}${nodes}</svg>`;}
function refs(t){if(!t.references.length)return '<p>本轮仅文字编辑，无视觉参考。</p>';return '<div class="refs">'+t.references.map(r=>{const isvideo=/\.(mp4|mov|webm)$/i.test(r.path);return `<figure class="${isvideo?'refvideo':''}">${isvideo?video(r.path,'本轮参考视频','reference.mp4'):`<a href="${esc(r.path)}" target="_blank"><img src="${esc(r.path)}" loading="lazy" alt="${esc(r.type+' '+(r.view||''))}"></a>`}<figcaption>${esc(r.type)} · ${esc(r.view||'')}</figcaption></figure>`;}).join('')+'</div>';}
function card(c){const s=state(c.id),n=c.completed_turns+1;const selected=new Set(s.turns);let row=`<div class="rowlabel">实际生成<br><small>Qwen + LTX A</small></div><article class="cell" id="${c.id}-v0"><h3>视频0 · 原始视频</h3><div class="parent">所有编辑的共同起点</div>${video(c.root,'原始视频',c.id+'_source.mp4')}<p class="prompt">生成后的视频会重新交给Qwen观察，后续按实际选择的版本继续编辑。</p></article>`;
for(const t of c.turns){row+=`<article class="cell ${t.parent!==t.id-1?'branch':''}" id="${c.id}-v${t.id}"><h3>视频${t.id} · ${esc(t.axis_zh)}</h3><div class="parent">实际：<a href="#${c.id}-v${t.parent}">视频${t.parent}</a> → ${t.id}${t.parent!==t.id-1?' · 回溯':''}<br>预期：视频${t.expected_parent} → ${t.id}${t.parent!==t.expected_parent?' <b class="error">起点不同</b>':''}</div>${video(t.output,'生成视频'+t.id,c.id+'_generated_'+t.id+'.mp4')}<label class="selectturn"><input type="checkbox" data-turn="${t.id}" data-chain="${c.id}" ${selected.has(t.id)?'checked':''}> 收藏这一轮</label><p class="prompt">${esc(t.prompt_zh||t.user_prompt)}</p><details><summary>实际指令与参考素材</summary><p><b>用户原始输入</b></p><p class="prompt">${esc(t.user_prompt)}</p><p><b>LTX实际执行</b></p><p class="prompt">${esc(t.editing_prompt)}</p>${refs(t)}</details></article>`;}
row+=`<div class="rowlabel">数据集真值<br><small>预定目标</small></div><article class="cell gt"><h3>视频0 · 相同起点</h3><div class="parent">原始视频</div>${video(c.root,'真值链起点',c.id+'_source.mp4')}</article>`;
for(const t of c.turns)row+=`<article class="cell gt"><h3>真值${t.id} · ${esc(t.axis_zh)}</h3><div class="parent">预期：视频${t.expected_parent} → ${t.id}<br>目标节点 ${t.target_node_id}</div>${video(t.ground_truth,'真值视频'+t.id,c.id+'_gt_'+t.id+'.mp4')}</article>`;
return `<section class="chain" id="${c.id}" data-id="${c.id}"><div class="head"><label><input type="checkbox" data-favorite="${c.id}" ${s.chain?'checked':''}> 收藏整链</label><h2>${esc(c.id)}</h2><span class="badge ${c.status==='partial'?'partial':''}">${c.status==='complete'?'完整完成':'尚未完成'} · ${c.completed_turns}/${c.planned_turns}轮</span><span class="badge">${c.turns.map(t=>esc(t.axis_zh)).join(' → ')}</span>${c.route_errors?`<span class="badge error">${c.route_errors}次起点不一致</span>`:''}</div><div class="route">${route(c)}</div><div class="controls"><button data-play="${c.id}">同步从头播放</button><button data-pause="${c.id}">暂停本链</button><button data-reset="${c.id}">归零</button><a href="cases/${c.id}.json" download>逐链记录</a><label class="note">选例备注 <input data-note="${c.id}" value="${esc(s.note)}" placeholder="例如：第3轮回溯效果清楚"></label></div><div class="scroll"><div class="grid" style="--n:${n}">${row}</div></div><p class="footer">橙色表示回溯，不表示错误。${c.status==='partial'?'这里只展示已完成的轮次，后续轮次尚无结果。':''} 选择编号符合预设不等于画面质量已通过验收。</p></section>`;}
function visible(c){const scope=document.getElementById('scope').value,a=document.getElementById('axis').value,n=document.getElementById('length').value,q=document.getElementById('search').value.trim().toLowerCase();if(scope==='starred'&&!state(c.id).chain&&!state(c.id).turns.length)return false;if(['complete','partial'].includes(scope)&&c.status!==scope)return false;if(a!=='all'&&!c.turns.some(t=>t.axis===a))return false;if(n!=='all'&&c.planned_turns!==Number(n))return false;return !q||[c.id,...c.turns.flatMap(t=>[t.prompt_zh,t.user_prompt,t.axis_zh])].join(' ').toLowerCase().includes(q);}
function updateStats(){const s=DATA.statistics,count=DATA.chains.filter(visible).length,marked=DATA.chains.filter(c=>state(c.id).chain||state(c.id).turns.length).length;document.getElementById('stats').textContent=`完整${s.complete_chains}条 / ${s.complete_chain_turns}轮；部分完成${s.partial_chains}条 / ${s.partial_chain_turns}轮。当前显示${count}条，已收藏${marked}条。整理于 ${DATA.created_at.slice(0,16).replace('T',' ')}。`;}
function render(){document.querySelectorAll('video').forEach(v=>v.pause());const c=DATA.chains.filter(visible);document.getElementById('gallery').innerHTML=c.length?c.map(card).join(''):'<div class="empty">没有符合条件的链。</div>';updateStats();}
for(const id of ['scope','axis','length'])document.getElementById(id).addEventListener('change',render);
let timer;document.getElementById('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,180);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.favorite){state(el.dataset.favorite).chain=el.checked;save();}if(el.dataset.turn){const s=state(el.dataset.chain),v=Number(el.dataset.turn);s.turns=el.checked?[...new Set([...s.turns,v])]:s.turns.filter(t=>t!==v);save();}});
document.addEventListener('input',e=>{if(e.target.dataset.note){state(e.target.dataset.note).note=e.target.value;save();}});
function videos(id){return [...document.getElementById(id).querySelectorAll('.grid > .cell > video')];}
document.addEventListener('click',e=>{const el=e.target;if(el.dataset.play){document.querySelectorAll('video').forEach(v=>v.pause());for(const v of videos(el.dataset.play)){v.currentTime=0;v.play().catch(()=>{});}}if(el.dataset.pause)videos(el.dataset.pause).forEach(v=>v.pause());if(el.dataset.reset)videos(el.dataset.reset).forEach(v=>{v.pause();v.currentTime=0;});});
document.getElementById('pauseAll').addEventListener('click',()=>document.querySelectorAll('video').forEach(v=>v.pause()));
document.getElementById('export').addEventListener('click',()=>{const selected=DATA.chains.filter(c=>state(c.id).chain||state(c.id).turns.length).map(c=>({chain_id:c.id,status:c.status,whole_chain:!!state(c.id).chain,selected_turns:state(c.id).turns,note:state(c.id).note,root:c.root,turns:c.turns.filter(t=>state(c.id).chain||state(c.id).turns.includes(t.id)).map(t=>({turn_id:t.id,axis:t.axis,parent:t.parent,expected_parent:t.expected_parent,output:t.output,ground_truth:t.ground_truth,user_prompt:t.user_prompt,editing_prompt:t.editing_prompt,references:t.references}))}));if(!selected.length){alert('请先收藏整条链或具体轮次。');return;}const blob=new Blob([JSON.stringify({exported_at:new Date().toISOString(),source_snapshot:DATA.created_at,selected},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qwen_ltx_A_paper_selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
render();
</script></body></html>
